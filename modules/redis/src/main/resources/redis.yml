# ===== Redis 설정 =====

---
spring:
  config:
    activate:
      on-profile: local, test
  data:
    redis:
      host: localhost
      port: 6379

---
spring:
  config:
    activate:
      on-profile: dev, prod
  data:
    redis:
      host: ${REDIS_HOSTNAME:localhost}
      port: ${REDIS_PORT:6379}
